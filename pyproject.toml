[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trovia"
version = "0.1.0"
description = "A local web search and page-reading service for AI agents, with a REST API and an MCP tool"
readme = "README.md"
requires-python = ">=3.11,<3.15"  # onnxruntime (via flashrank) has no wheels for newer Python yet
keywords = ["search", "mcp", "llm", "agents", "rag", "web-search"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "curl-cffi>=0.7",
    "ddgs>=9",
    "trafilatura>=1.12",
    "diskcache>=5.6",
    "flashrank>=0.2.9",
    "mcp>=1.2,<2",
    "typer>=0.12",
    "platformdirs>=4",
    "tomli-w>=1.0",
]

[project.urls]
Homepage = "https://abyssalwolf.github.io/trovia/"
Documentation = "https://github.com/Abyssalwolf/trovia/tree/main/docs"
Repository = "https://github.com/Abyssalwolf/trovia"
Issues = "https://github.com/Abyssalwolf/trovia/issues"

[project.scripts]
trovia = "trovia.cli:app"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[tool.hatch.build.targets.wheel]
packages = ["trovia"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
